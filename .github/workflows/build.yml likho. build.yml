name: Build ZXC APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o ZXC.zip
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Build
        run: |
          set +e
          gradle assembleDebug --no-daemon --console=plain > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -E "^e: |error:|What went wrong|Could not|FAILED" -A2 build.log | head -30 | sed ':a;N;$!ba;s/\n/%0A/g' > err.txt
            echo "::error title=ASLI ERROR::$(cat err.txt)"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: build-log, path: build.log }
      - uses: actions/upload-artifact@v4
        with: { name: ZXC-apk, path: app/build/outputs/apk/debug/app-debug.apk }
